name: notifier

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: notifier
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-none
          restore-keys: state-

      - name: Poll and notify
        run: python3 notifier.py --run-once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_URL: ${{ secrets.API_URL }}
          POSITIONS_PATH: ${{ secrets.POSITIONS_PATH }}
          KEY_FIELDS: ${{ secrets.KEY_FIELDS }}
          MSG_FIELDS: ${{ secrets.MSG_FIELDS }}

      - name: Save state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
